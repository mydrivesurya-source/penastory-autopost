name: Build and publish to Instagram
on:
  schedule:            # backup triggers (keeper.yml is the main 10-minute trigger)
    - cron: "5 5 * * *"     # 10:35 IST
    - cron: "35 7 * * *"    # 13:05 IST
    - cron: "5 11 * * *"    # 16:35 IST
    - cron: "5 14 * * *"    # 19:35 IST
    - cron: "5 16 * * *"    # 21:35 IST
  push:
    paths: ["specs/**", "scripts/**", "control/**"]
  workflow_dispatch:
    inputs:
      prefix: {description: "Publish this queue file prefix now (optional)", required: false}
concurrency: {group: pas, cancel-in-progress: false}   # one run at a time
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 20}   # newest main at job start, never the stale trigger snapshot
      - run: git config user.name "pas-bot" && git config user.email "bot@users.noreply.github.com"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
          pip install -q pillow numpy fonttools
      - name: Build new specs
        run: python scripts/build.py
      - name: Save built media
        run: |
          git add -A media queue
          git diff --cached --quiet && exit 0
          git commit -qm "Build media"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; sleep 5; done; exit 1
      - name: Publish due posts
        if: github.event_name != 'push'
        run: sleep 20 && python scripts/publish.py ${{ github.event.inputs.prefix }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
      - name: Publish now (control/publish-now.txt holds a queue prefix)
        if: github.event_name == 'push' && hashFiles('control/publish-now.txt') != ''
        run: |
          P=$(head -1 control/publish-now.txt | tr -d '[:space:]')
          sleep 20 && python scripts/publish.py "$P"
          git rm -q control/publish-now.txt
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
      - name: Stats for the daily report (every run after 21:40 IST, once)
        if: github.event_name != 'push'
        run: |
          m=$(( ( $(date -u +%s) / 60 + 330 ) % 1440 ))
          if [ $m -ge 1300 ] && [ "$(date -u +%F)" != "$(cat status/stats_day 2>/dev/null)" ]; then python scripts/stats.py && date -u +%F > status/stats_day; fi
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
      - name: Stats now (control/stats-now.txt)
        if: github.event_name == 'push' && hashFiles('control/stats-now.txt') != ''
        run: python scripts/stats.py; git rm -q control/stats-now.txt
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
      - name: Save stats / leftovers
        if: always()
        run: |
          git add -A status control
          git diff --cached --quiet && exit 0
          git commit -qm "Status"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; sleep 5; done
