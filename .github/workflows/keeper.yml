name: Keeper (reliable publish trigger)
# GitHub's cron schedule is unreliable, so this job wakes every 10 minutes and
# triggers publish.yml (which only posts items whose IST slot has passed).
# It runs ~5h40m, then re-dispatches itself, so it never stops.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
concurrency: {group: pas-keeper, cancel-in-progress: false}
permissions: {actions: write, contents: read}
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Loop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ $(date +%s) -lt $end ]; do
            # IST minutes past midnight; only fire during posting hours 10:00-22:30 IST
            m=$(( ( $(date -u +%s) / 60 + 330 ) % 1440 ))
            if [ $m -ge 600 ] && [ $m -le 1350 ]; then
              gh api -X POST repos/$REPO/actions/workflows/publish.yml/dispatches -f ref=main && echo "dispatched at IST minute $m"
            fi
            sleep 600
          done
      - name: Restart myself
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/keeper.yml/dispatches -f ref=main
